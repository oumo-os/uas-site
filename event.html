<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event — Uganda Astronomical Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .article-hero { padding: 3rem 0 1rem; }
    .article-hero h1 { font-size: 2rem; font-weight: 800; margin: 0.5rem 0; }
    .ev-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin: 1.5rem 0; }
    .ev-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; }
    .ev-box .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); }
    .ev-box .v { font-weight: 600; font-size: 0.95rem; margin-top: 0.2rem; }
    .att-row { display: flex; justify-content: space-between; align-items: center; padding: 0.55rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container" style="display:flex;align-items:center;width:100%">
      <a href="/" class="nav-brand">UAS</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/about" class="nav-link">About</a>
        <a href="/programmes" class="nav-link">Programmes</a>
        <a href="/events" class="nav-link">Events</a>
        <a href="/knowledge" class="nav-link">Knowledge</a>
        <a href="/library" class="nav-link">Library</a>
        <a href="/ecosystem" class="nav-link">Ecosystem</a>
        <a href="/members" class="nav-link">Members</a>
        <a href="/contact" class="nav-link">Contact</a>
        <a href="/search" class="nav-link">Search</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
      </div>
      <div class="nav-user" id="navUser"></div>
    </div>
  </nav>

  <div class="container" style="max-width:780px">
    <div class="article-hero">
      <a href="/events" class="text-dim" style="font-size:0.85rem;text-decoration:none">← Events</a>
      <h1 id="eTitle"></h1>
      <div class="text-dim" id="eMeta"></div>
      <div class="ev-details" id="eDetails"></div>
      <div id="eActions"></div>
      <div class="text-success" id="eMsg" style="font-size:0.9rem"></div>
    </div>
    <div class="article-body" id="eBody"></div>
    <div id="eAttendees"></div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 Uganda Astronomical Society. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script>
    let eventId = null;

    async function load() {
      try { await api.me(); } catch(e) {}
      updateNavUser();

      const id = new URLSearchParams(location.search).get('id');
      if (!id) { document.getElementById('eTitle').textContent = 'Event not found'; return; }
      eventId = parseInt(id, 10);
      const d = await api.request('/events/' + eventId).catch(() => null);
      if (!d) { document.getElementById('eTitle').textContent = 'Event not found'; return; }
      render(d);
      window.scrollTo(0, 0);
    }

    function render(d) {
      const e = d.event;
      document.title = e.title + ' — Uganda Astronomical Society';
      document.getElementById('eTitle').textContent = e.title;
      document.getElementById('eMeta').innerHTML = `
        <span class="badge badge-${e.status === 'published' ? 'active' : 'pending'}">${esc(e.status)}</span>
        Organised by <strong>${esc(e.organiser_name)}</strong>
      `;
      document.getElementById('eDetails').innerHTML = [
        box('Date', new Date(e.date).toLocaleString('en', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })),
        box('Location', e.location || '—'),
        box('Capacity', e.capacity ? `${d.stats.total} / ${e.capacity}` : `${d.stats.total} registered`),
        box('Status', e.status),
      ].join('');
      document.getElementById('eBody').innerHTML = (e.description || '<p class="text-dim">No description.</p>') +
        `<p class="text-dim" style="margin-top:1.5rem">Public event · Questions? <a href="/contact">Contact us</a>.</p>`;
      renderActions(d);
      if (d.is_manager) renderAttendees(d.registrations);
    }

    function box(k, v) { return `<div class="ev-box"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`; }

    function renderActions(d) {
      const el = document.getElementById('eActions');
      const e = d.event;
      const past = new Date(e.date) < new Date();
      if (!api._user) { el.innerHTML = `<p class="text-dim" style="font-size:0.9rem"><a href="/login">Login</a> to RSVP.</p>`; return; }
      if (!api.hasCap('events.rsvp')) { el.innerHTML = ''; return; }
      if (past || e.status === 'cancelled') { el.innerHTML = `<p class="text-dim" style="font-size:0.9rem">RSVP closed.</p>`; return; }
      if (d.my_rsvp && d.my_rsvp.status === 'registered') {
        el.innerHTML = `<button class="btn btn-outline" onclick="cancelRsvp()">Cancel RSVP</button>
          <span class="text-success" style="font-size:0.9rem">You're registered.</span>`;
      } else if (d.my_rsvp && d.my_rsvp.status === 'cancelled') {
        el.innerHTML = `<button class="btn btn-primary" onclick="rsvp()">Re-register</button>`;
      } else {
        el.innerHTML = `<button class="btn btn-primary" onclick="rsvp()">RSVP</button>`;
      }
    }

    async function rsvp() {
      try {
        await api.request('/events/' + eventId + '/rsvp', { method: 'POST' });
        document.getElementById('eMsg').textContent = 'Registered! See you there.';
        load();
      } catch(e) { alert(e.error || 'Could not RSVP'); }
    }
    async function cancelRsvp() {
      try {
        await api.request('/events/' + eventId + '/rsvp', { method: 'DELETE' });
        document.getElementById('eMsg').textContent = 'RSVP cancelled.';
        load();
      } catch(e) { alert(e.error || 'Could not cancel'); }
    }

    function renderAttendees(list) {
      const el = document.getElementById('eAttendees');
      el.innerHTML = `<h3 class="section-title" style="margin-top:2rem">Attendees (${list.length})</h3>` + list.map(r => `
        <div class="att-row">
          <div><strong>${esc(r.name)}</strong> <span class="text-dim">${esc(r.email)}</span></div>
          <div>
            <span class="badge ${r.status === 'attended' ? 'badge-active' : r.status === 'cancelled' ? 'badge-inactive' : 'badge-pending'}">${esc(r.status)}</span>
            ${r.status === 'registered' ? `<button class="btn btn-outline btn-xs" onclick="markAttended(${r.id})">Mark attended</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function markAttended(regId) {
      try {
        await api.request(`/events/${eventId}/rsvps/${regId}/attended`, { method: 'POST' });
        load();
      } catch(e) { alert(e.error || 'Failed'); }
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
    function updateNavUser() {
      const el = document.getElementById('navUser');
      el.innerHTML = api._user
        ? `<a href="/dashboard" class="btn btn-outline btn-sm">${esc(api._user.name)}</a>`
        : `<a href="/login" class="btn btn-primary btn-sm">Login</a>`;
    }
    load();
  </script>
</body>
</html>
