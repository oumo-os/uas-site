<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programmes — Uganda Astronomical Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .page-header { padding: 3rem 0 2rem; text-align: center; }
    .page-header h1 { font-size: 2.2rem; font-weight: 800; }
    .page-header p { color: var(--text-dim); max-width: 600px; margin: 0.5rem auto 0; }
    .programme-card { padding: 1.5rem; margin-bottom: 1rem; }
    .programme-card h3 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .programme-card p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 0.75rem; }
    .programme-meta { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-faint); }
    .programme-meta span { display: flex; align-items: center; gap: 0.3rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container" style="display:flex;align-items:center;width:100%">
      <a href="/" class="nav-brand">UAS</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/about" class="nav-link">About</a>
        <a href="/programmes" class="nav-link active">Programmes</a>
        <a href="/events" class="nav-link">Events</a>
        <a href="/knowledge" class="nav-link">Knowledge</a>
        <a href="/library" class="nav-link">Library</a>
        <a href="/ecosystem" class="nav-link">Ecosystem</a>
        <a href="/members" class="nav-link">Members</a>
        <a href="/contact" class="nav-link">Contact</a>
        <a href="/search" class="nav-link">Search</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/profile" class="nav-link">Profile</a>
        </div>
      <div class="nav-user" id="navUser"></div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Programmes</h1>
      <p>Long-running initiatives that advance astronomy across Uganda</p>
    </div>
    <div id="programmesList"></div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 Uganda Astronomical Society. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    async function load() {
      try { await api.me(); } catch(e) {}
      updateNavUser();

      const programmes = await api.getPublicProgrammes().catch(() => []);
      const div = document.getElementById('programmesList');

      if (programmes.length) {
        div.innerHTML = programmes.map(p => `
          <div class="card programme-card" style="cursor:pointer" onclick="location.href=ua('/programmes/${p.id}')">
            <div class="flex-between mb-1">
              <h3>${esc(p.title)}</h3>
              <span class="badge badge-${esc(p.status)}">${esc(p.status)}</span>
            </div>
            <p>${esc(p.description || '')}</p>
            <div class="programme-meta">
              ${p.lead_name ? `<span>👤 ${esc(p.lead_name)}</span>` : ''}
              ${p.start_date ? `<span>📅 Started ${esc(p.start_date)}</span>` : ''}
              <span class="text-dim" style="margin-left:auto">View details →</span>
            </div>
          </div>
        `).join('');
      } else {
        div.innerHTML = '<p class="text-center text-dim" style="padding:3rem 0">Programmes will appear here once created by the Board.</p>';
      }
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
    function updateNavUser() {
      const el = document.getElementById('navUser');
      el.innerHTML = api._user
        ? `<a href="/dashboard" class="btn btn-outline btn-sm">${esc(api._user.name)}</a>`
        : `<a href="/login" class="btn btn-primary btn-sm">Login</a>`;
    }
    load();
  </script>
</body>
</html>
