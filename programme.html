<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programme — Uganda Astronomical Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .prog-hero {
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .prog-hero h1 { font-size: 2rem; font-weight: 800; margin: 0 0 0.5rem; }
    .prog-hero .lead { color: var(--text-dim); max-width: 640px; }
    .prog-stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.25rem; }
    .stat-chip {
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 0.5rem 1rem; font-size: 0.8rem; background: var(--bg-card);
    }
    .stat-chip b { display: block; font-size: 1.1rem; }
    .obj-list { list-style: none; padding: 0; margin: 0; }
    .obj-list li {
      padding: 0.6rem 0.9rem; margin-bottom: 0.5rem;
      border-left: 3px solid var(--accent); background: var(--bg-card);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container" style="display:flex;align-items:center;width:100%">
      <a href="/" class="nav-brand">UAS</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/about" class="nav-link">About</a>
        <a href="/programmes" class="nav-link active">Programmes</a>
        <a href="/events" class="nav-link">Events</a>
        <a href="/knowledge" class="nav-link">Knowledge</a>
        <a href="/library" class="nav-link">Library</a>
        <a href="/ecosystem" class="nav-link">Ecosystem</a>
        <a href="/members" class="nav-link">Members</a>
        <a href="/contact" class="nav-link">Contact</a>
        <a href="/search" class="nav-link">Search</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
      </div>
      <div class="nav-user" id="navUser"></div>
    </div>
  </nav>

  <div class="container" id="progRoot">
    <div class="prog-hero">
      <a href="/programmes" class="text-dim" style="font-size:0.85rem;text-decoration:none">← All programmes</a>
      <h1 id="pTitle"></h1>
      <p class="lead" id="pDesc"></p>
      <div class="prog-stats" id="pStats"></div>
    </div>
    <div class="grid-2 gap-3" style="align-items:start">
      <div class="card" style="padding:1.25rem">
        <h3 class="section-title" style="margin-top:0">Objectives</h3>
        <ul class="obj-list" id="pObjectives"></ul>
      </div>
      <div class="card" style="padding:1.25rem">
        <h3 class="section-title" style="margin-top:0">Projects</h3>
        <div id="pProjects"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 Uganda Astronomical Society. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script>
    async function load() {
      try { await api.me(); } catch(e) {}
      updateNavUser();

      const id = new URLSearchParams(location.search).get('id');
      if (!id) { document.getElementById('pTitle').textContent = 'Programme not found'; return; }
      const p = await api.getPublicProgramme(id).catch(() => null);
      if (!p) { document.getElementById('pTitle').textContent = 'Programme not found'; return; }

      document.getElementById('pTitle').textContent = p.title;
      document.getElementById('pDesc').textContent = p.description || '';
      document.getElementById('pStats').innerHTML = `
        ${p.lead_name ? `<span class="stat-chip">Lead<b>${esc(p.lead_name)}</b></span>` : ''}
        <span class="stat-chip">Projects<b>${p.projects.length}</b></span>
        ${p.budget ? `<span class="stat-chip">Budget<b>UGX ${Number(p.budget).toLocaleString()}</b></span>` : ''}
        ${p.spent ? `<span class="stat-chip">Spent<b>UGX ${Number(p.spent).toLocaleString()}</b></span>` : ''}
      `;
      const objs = document.getElementById('pObjectives');
      objs.innerHTML = p.objectives
        ? p.objectives.split(/\r?\n/).filter(Boolean).map(o => `<li>${esc(o)}</li>`).join('')
        : '<p class="text-dim">No objectives listed.</p>';

      const projDiv = document.getElementById('pProjects');
      if (!p.projects.length) { projDiv.innerHTML = '<p class="text-dim">No projects under this programme yet.</p>'; return; }
      projDiv.innerHTML = p.projects.map(pr => `
        <div style="padding:0.75rem 0;border-bottom:1px solid var(--border)">
          <h4 style="margin:0 0 0.25rem">${esc(pr.title)}</h4>
          <p style="margin:0;font-size:0.85rem;color:var(--text-dim)">${esc(pr.description || '')}</p>
          <span class="badge badge-active">${esc(pr.status)}</span>
          ${pr.deadline ? `<span class="text-dim" style="font-size:0.8rem"> · due ${esc(pr.deadline)}</span>` : ''}
        </div>
      `).join('');
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
    function updateNavUser() {
      const el = document.getElementById('navUser');
      el.innerHTML = api._user
        ? `<a href="/dashboard" class="btn btn-outline btn-sm">${esc(api._user.name)}</a>`
        : `<a href="/login" class="btn btn-primary btn-sm">Login</a>`;
    }
    load();
  </script>
</body>
</html>
