<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosystem — Uganda Astronomical Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .page-header { padding: 3rem 0 2rem; text-align: center; }
    .page-header h1 { font-size: 2.2rem; font-weight: 800; }
    .page-header p { color: var(--text-dim); max-width: 600px; margin: 0.5rem auto 0; }
    .eco-section { margin-bottom: 2.5rem; }
    .eco-section h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; }
    .partner-card {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 0.75rem; text-decoration: none; color: var(--text);
      transition: border-color 0.15s;
    }
    .partner-card:hover { border-color: var(--accent); }
    .partner-icon {
      width: 48px; height: 48px; border-radius: var(--radius);
      background: var(--accent-glow); display: flex; align-items: center;
      justify-content: center; font-size: 1.3rem; flex-shrink: 0;
    }
    .partner-info h3 { font-size: 0.95rem; margin-bottom: 0.15rem; }
    .partner-info p { font-size: 0.85rem; color: var(--text-dim); }
    .link-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0.75rem; }
    .link-card {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius);
      text-decoration: none; color: var(--text); transition: border-color 0.15s;
    }
    .link-card:hover { border-color: var(--accent); }
    .link-card .icon { font-size: 1.2rem; }
    .link-card .text h4 { font-size: 0.9rem; margin-bottom: 0.1rem; }
    .link-card .text p { font-size: 0.8rem; color: var(--text-dim); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container" style="display:flex;align-items:center;width:100%">
      <a href="/" class="nav-brand">UAS</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/about" class="nav-link">About</a>
        <a href="/programmes" class="nav-link">Programmes</a>
        <a href="/events" class="nav-link">Events</a>
        <a href="/knowledge" class="nav-link">Knowledge</a>
        <a href="/ecosystem" class="nav-link active">Ecosystem</a>
        <a href="/members" class="nav-link">Members</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
      </div>
      <div class="nav-user" id="navUser"></div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Ecosystem</h1>
      <p>Our partners, affiliates, and the broader astronomy community</p>
    </div>

    <section class="eco-section">
      <h2>Partners & Affiliates</h2>
      <div id="partnersList"></div>
    </section>

    <section class="eco-section">
      <h2>Useful Links</h2>
      <div class="link-grid" id="linksList"></div>
    </section>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 Uganda Astronomical Society. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    async function load() {
      try { await api.me(); } catch(e) {}
      updateNavUser();

      const [partners, links] = await Promise.all([
        api.getPartners().catch(() => []),
        api.getLinks().catch(() => []),
      ]);

      const pDiv = document.getElementById('partnersList');
      if (partners.length) {
        pDiv.innerHTML = partners.map(p => `
          <div class="partner-card" ${p.website ? `onclick="window.open('${esc(p.website)}','_blank')"` : ''}>
            <div class="partner-icon">${esc(p.relationship_type === 'institutional' ? '🏛️' : p.relationship_type === 'sponsor' ? '💼' : '🤝')}</div>
            <div class="partner-info">
              <h3>${esc(p.organization)}</h3>
              <p>${esc(p.description || '').slice(0, 120)}</p>
            </div>
          </div>
        `).join('');
      } else {
        pDiv.innerHTML = '<p class="text-dim">Partners will appear here.</p>';
      }

      const lDiv = document.getElementById('linksList');
      if (links.length) {
        lDiv.innerHTML = links.map(l => `
          <a href="${esc(l.url)}" target="_blank" rel="noopener" class="link-card">
            <span class="icon">🔗</span>
            <div class="text">
              <h4>${esc(l.title)}</h4>
              <p>${esc(l.description || '').slice(0, 80)}</p>
            </div>
          </a>
        `).join('');
      } else {
        lDiv.innerHTML = '<p class="text-dim">Useful links will appear here.</p>';
      }
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
    function updateNavUser() {
      const el = document.getElementById('navUser');
      el.innerHTML = api._user
        ? `<a href="/dashboard" class="btn btn-outline btn-sm">${esc(api._user.name)}</a>`
        : `<a href="/login" class="btn btn-primary btn-sm">Login</a>`;
    }
    load();
  </script>
</body>
</html>
