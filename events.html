<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Uganda Astronomical Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .page-header { padding: 3rem 0 2rem; text-align: center; }
    .page-header h1 { font-size: 2.2rem; font-weight: 800; }
    .page-header p { color: var(--text-dim); max-width: 600px; margin: 0.5rem auto 0; }
    .event-card {
      display: flex;
      gap: 1.25rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
    }
    .event-date-box {
      min-width: 70px;
      text-align: center;
      padding: 0.75rem;
      background: var(--accent-glow);
      border-radius: var(--radius);
      align-self: flex-start;
    }
    .event-date-box .day { font-size: 1.8rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .event-date-box .month { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
    .event-date-box .year { font-size: 0.7rem; color: var(--text-faint); }
    .event-body h3 { font-size: 1.1rem; margin-bottom: 0.35rem; }
    .event-body p { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 0.5rem; }
    .event-meta { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--text-faint); flex-wrap: wrap; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container" style="display:flex;align-items:center;width:100%">
      <a href="/" class="nav-brand">UAS</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/about" class="nav-link">About</a>
        <a href="/programmes" class="nav-link">Programmes</a>
        <a href="/events" class="nav-link active">Events</a>
        <a href="/knowledge" class="nav-link">Knowledge</a>
        <a href="/library" class="nav-link">Library</a>
        <a href="/ecosystem" class="nav-link">Ecosystem</a>
        <a href="/members" class="nav-link">Members</a>
        <a href="/contact" class="nav-link">Contact</a>
        <a href="/search" class="nav-link">Search</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/profile" class="nav-link">Profile</a>
        </div>
      <div class="nav-user" id="navUser"></div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Events</h1>
      <p>Observing sessions, lectures, workshops, and community gatherings</p>
    </div>
    <div id="eventsList"></div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 Uganda Astronomical Society. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    let myRsvps = {};

    async function load() {
      try { await api.me(); } catch(e) {}
      updateNavUser();

      const [events, myEvents] = await Promise.all([
        api.getPublicEvents().catch(() => []),
        api._user ? api.getEvents().catch(() => []) : Promise.resolve([]),
      ]);
      myEvents.forEach(e => { if (e.status === 'published') myRsvps[e.id] = true; });

      const div = document.getElementById('eventsList');

      if (events.length) {
        div.innerHTML = events.map(e => {
          const d = new Date(e.date);
          const full = e.capacity ? e.rsvp_count >= e.capacity : false;
          const cancelled = e.status === 'cancelled';
          return `
            <div class="event-card">
              <div class="event-date-box">
                <div class="day">${d.getDate()}</div>
                <div class="month">${d.toLocaleString('en',{month:'short'})}</div>
                <div class="year">${d.getFullYear()}</div>
              </div>
              <div class="event-body">
                <h3>${esc(e.title)} ${cancelled ? '<span class="badge badge-inactive">cancelled</span>' : ''}</h3>
                <p>${esc(e.description || '').slice(0, 200)}</p>
                <div class="event-meta">
                  ${e.location ? `<span>📍 ${esc(e.location)}</span>` : ''}
                  <span>🕐 ${d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})}</span>
                  ${e.end_date ? `<span>→ ${new Date(e.end_date).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})}</span>` : ''}
                  <span>👥 ${e.rsvp_count || 0}${e.capacity ? ' / ' + e.capacity : ''} attending</span>
                </div>
                <div class="event-actions" style="margin-top:0.75rem">
                  ${cancelled ? '' : `
                  ${e.capacity ? `
                    <div class="capacity-bar" style="background:#1e293b;border-radius:4px;height:6px;margin-bottom:0.5rem;overflow:hidden">
                      <div style="width:${Math.min(100, e.rsvp_count / e.capacity * 100)}%;height:100%;background:var(--success)"></div>
                    </div>` : ''}
                  ${api._user ? (myRsvps[e.id] ? `
                    <button class="btn btn-outline btn-sm" onclick="cancelRsvp(${e.id})">Cancel RSVP</button>
                  ` : (full ? `
                    <button class="btn btn-sm" disabled style="opacity:0.6">Event Full</button>
                  ` : `
                    <button class="btn btn-primary btn-sm" onclick="rsvp(${e.id})">RSVP</button>
                  `)) : `
                    <a href="/login" class="btn btn-outline btn-sm">Sign in to RSVP</a>
                  `}`}
                  ${canManage(e) && !cancelled ? `
                    <button class="btn btn-outline btn-sm" onclick="toggleAttendees(${e.id}, this)">View Attendees (${e.rsvp_count || 0})</button>
                  ` : ''}
                  <a class="btn btn-outline btn-sm" href="/event/${e.id}">Details</a>
                </div>
                ${canManage(e) ? `<div class="attendee-list" id="attendees-${e.id}" style="display:none;margin-top:0.75rem;border-top:1px solid var(--border);padding-top:0.75rem"></div>` : ''}
              </div>
            </div>
          `;
        }).join('');
      } else {
        div.innerHTML = '<p class="text-center text-dim" style="padding:3rem 0">No upcoming events. Check back soon!</p>';
      }
    }

    function canManage(e) {
      return api.hasCap('events.manage_rsvps') || (e.organizer_id && api._user && e.organizer_id === api._user.id);
    }

    async function toggleAttendees(id, btn) {
      const box = document.getElementById('attendees-' + id);
      if (box.style.display !== 'none') { box.style.display = 'none'; return; }
      await renderAttendees(id, box);
    }

    async function renderAttendees(id, box) {
      try {
        const list = await api.getEventRsvps(id);
        box.innerHTML = list.length ? list.map(r => `
          <div class="flex-between" style="padding:0.25rem 0;font-size:0.85rem">
            <span>${esc(r.name)} <span class="text-dim">${esc(r.email)}</span></span>
            <span class="flex gap-2" style="align-items:center">
              <span class="badge badge-${r.status === 'registered' ? 'active' : (r.status === 'attended' ? 'active' : 'inactive')}">${esc(r.status)}</span>
              ${r.status === 'registered' ? `<button class="btn btn-outline btn-xs" onclick="markAttended(${id}, ${r.id})">Attended</button>` : ''}
            </span>
          </div>`).join('')
        : '<p class="text-dim" style="font-size:0.85rem">No attendees yet.</p>';
        box.style.display = 'block';
      } catch(e) { alert(e.error || 'Failed to load attendees'); }
    }

    async function markAttended(eventId, regId) {
      try {
        await api.request(`/events/${eventId}/rsvps/${regId}/attended`, { method: 'POST' });
        await renderAttendees(eventId, document.getElementById('attendees-' + eventId));
      } catch(e) { alert(e.error || 'Failed'); }
    }

    async function rsvp(id) {
      try { await api.rsvpEvent(id); alert('You are registered!'); load(); }
      catch(e) { alert(e.error || 'RSVP failed'); }
    }

    async function cancelRsvp(id) {
      try { await api.cancelRsvp(id); alert('Registration cancelled.'); load(); }
      catch(e) { alert(e.error || 'Failed'); }
    }

    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
    function updateNavUser() {
      const el = document.getElementById('navUser');
      el.innerHTML = api._user
        ? `<a href="/dashboard" class="btn btn-outline btn-sm">${esc(api._user.name)}</a>`
        : `<a href="/login" class="btn btn-primary btn-sm">Login</a>`;
    }
    load();
  </script>
</body>
</html>
