<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — UAS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.25rem; }
    .auth-header p { color: var(--text-dim); }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .auth-tab {
      flex: 1; padding: 0.6rem; text-align: center;
      border-bottom: 2px solid transparent; color: var(--text-dim);
      cursor: pointer; font-size: 0.9rem; background: none; border-top: none;
      border-left: none; border-right: none; font-family: inherit;
    }
    .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>UAS</h1>
        <p>Uganda Astronomical Society</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Login</button>
        <button class="auth-tab" onclick="showTab('register')">Register</button>
      </div>

      <!-- Login -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="loginEmail" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="loginPass" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">Login</button>
        <div class="error-msg" id="loginError"></div>
      </form>

      <!-- Register -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="regName" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="regEmail" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="regPass" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Institution (optional)</label>
          <input type="text" class="form-input" id="regInstitution">
        </div>
        <div class="form-group">
          <label class="form-label">Membership Category</label>
          <select class="form-select" id="regCategory">
            <option value="regular">Regular</option>
            <option value="student">Student</option>
            <option value="honorary">Honorary</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="regBtn">Register</button>
        <div class="error-msg" id="regError"></div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    function showTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Logging in...'; err.style.display = 'none';
      try {
        await api.login(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPass').value
        );
        window.location.href = ua('/dashboard');
      } catch(e) {
        err.textContent = e.error || 'Login failed';
        err.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Login';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const err = document.getElementById('regError');
      btn.disabled = true; btn.textContent = 'Registering...'; err.style.display = 'none';
      try {
        await api.register(
          document.getElementById('regName').value,
          document.getElementById('regEmail').value,
          document.getElementById('regPass').value,
          {
            institution: document.getElementById('regInstitution').value || undefined,
            category: document.getElementById('regCategory').value,
          }
        );
        window.location.href = ua('/dashboard');
      } catch(e) {
        err.textContent = e.error || 'Registration failed';
        err.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Register';
      }
    }

    // Auto-redirect if already logged in
    (async () => {
      try { await api.me(); window.location.href = ua('/dashboard'); } catch(e) {}
    })();
  </script>
</body>
</html>
